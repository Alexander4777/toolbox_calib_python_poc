[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calib"
version = "1.0.0"
description = "A Python port of Bouguet's Camera Calibration Toolbox for Matlab"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Port of J.-Y. Bouguet's Camera Calibration Toolbox" }]
keywords = ["computer-vision", "camera-calibration", "stereo"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7.0", "pyflakes>=3.0"]

[project.scripts]
calib-gui = "calib.gui.main_window:run"

[tool.setuptools]
packages = ["calib", "calib.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
